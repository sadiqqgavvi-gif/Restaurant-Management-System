# One-click deploy on Render (render.com → New → Blueprint → pick this repo).
# A single Node web service builds the React app and serves it together with the API.
services:
  - type: web
    name: ember-restaurant
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client --include=dev && npm run build --prefix client && npm ci --prefix server --omit=dev
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI # your MongoDB Atlas connection string
        sync: false
      - key: ADMIN_EMAIL
        value: admin@ember.com
      - key: ADMIN_PASSWORD # choose a strong password — "admin123" is refused in production
        sync: false
      - key: JWT_SECRET
        generateValue: true
